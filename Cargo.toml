[workspace]
resolver = "3"
members = [
    "crates/dctl-secmem",
    "crates/dctl-crypto",
    "crates/dctl-meta",
    "crates/dctl-store",
    "crates/dctl-index",
    "crates/dctl-core",
    "crates/dctl-cli",
    "crates/dctl-decode",
]
# cargo-fuzz crates are isolated (nightly-only); keep them out of the main build.
exclude = ["crates/dctl-crypto/fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Proprietary"
repository = "local"

# Single source of truth for shared dependency versions across the workspace.
[workspace.dependencies]
# Secure-memory crate: the one audited home for unsafe FFI (mlock / anti-debug).
dctl-secmem = { path = "crates/dctl-secmem" }
thiserror = "2"
blake3 = "1"
sha1 = "0.10"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"
bytes = "1"
hex = "0.4"
directories = "5"
# Multi-process-safe index store: SQLite + full-database encryption (SQLCipher).
# `bundled-sqlcipher-vendored-openssl` compiles SQLCipher and vendors OpenSSL from
# source, so no system libsqlite3/OpenSSL is required (only a C toolchain). See
# docs/FORMAT.md §9.4/§9.5 — the App and its File-Provider extension share one
# App-Group DB via WAL; records stay AEAD-encrypted and keyed by hash(NFC(path)).
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
rustls = "0.23"
rustls-post-quantum = "0.2"
webpki-roots = "0.26"
hmac = "0.13"
quick-xml = "0.37"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rpassword = "7"
unicode-normalization = "0.1"
# §5 "assigned code points only" repertoire pin. Exposes Unicode General_Category
# with a public `UNICODE_VERSION` constant. Version 0.1.2 ships UCD **15.1.0**
# exactly (`UNICODE_VERSION == (15, 1, 0)`); 0.1.1 is 15.0.0 and 0.1.3+ moved to
# 16.0.0. The `=` pin is REQUIRED: a caret bump to 0.1.3/0.1.4 would silently shift
# the frozen §5 repertoire. A version-guard (compile-time + test) fails loudly if
# this ever resolves to anything but 15.1.0. `general-category` is the only table
# we need (drops the emoji tables).
unicode-properties = { version = "=0.1.2", default-features = false, features = ["general-category"] }
bip39 = "2"
libc = "0.2"
subtle = "2.6"
ml-kem = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# dev
proptest = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Optimize the shipped binary hard; crypto/hash hot paths benefit most.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
