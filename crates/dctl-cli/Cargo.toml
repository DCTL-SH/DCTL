[package]
name = "dctl-cli"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DCTL command-line interface"

# Binary name mirrors dctl_meta::BINARY_NAME (rename both together to rebrand).
[[bin]]
name = "dctl"
path = "src/main.rs"

[dependencies]
dctl-core = { path = "../dctl-core" }
dctl-store = { path = "../dctl-store" }
dctl-meta = { path = "../dctl-meta" }
# shared across the workspace
blake3 = { workspace = true }
# `dctl hashsum sha1|sha256`. The vault records only BLAKE3, so these two exist
# purely for interoperability with software that predates it — a twenty-year
# tool has to be able to hand its checksums to a tape catalogue. Both versions
# come from the workspace table, which is what keeps the digest DCTL prints and
# the digest dctl-store computes for a provider's own checksum header identical
# by construction rather than by coincidence.
sha1 = { workspace = true }
sha2 = { workspace = true }
# `crate::source` is the one read abstraction, and it is object-safe by
# necessity — every command holds a `Box<dyn Source>` so that nothing above it
# can tell a sealed vault from a plain store. Native `async fn` in traits does
# not yet produce object-safe traits, so the same crate the storage layer uses
# for `Backend` provides the boxing here.
async-trait = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# `signal` powers the Ctrl-C race in main.rs: an interrupted run must exit 25,
# never be reported as success.
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
# `json` provides the structured sink PLAN.md §7 requires alongside the human one.
tracing-subscriber = { workspace = true, features = ["json"] }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Plaintext held in flight between pipeline stages is wiped on drop.
zeroize = { workspace = true }
# `Backend::put` takes an owned `bytes::Bytes` — the provider implementations
# need a cheaply-cloneable buffer to retry a request with — so any crate that
# stores an object has to name the type. `crate::remote::plain` is the one place
# here that does; everything else reads through `Bytes` without spelling it.
bytes = { workspace = true }
# `rcat` spools a stream of unknown length to a temporary file so it can be
# sealed with `Vault::put_file_from_path` in constant memory. Owner-only
# permissions and removal-on-drop are the properties that matter, and both are
# this crate's — hand-rolling either around the user's plaintext would be the
# wrong place to save a dependency. Already a runtime dependency of dctl-core
# and dctl-store, which spool for the same reason.
tempfile = { workspace = true }
# CLI-specific (pinned in this crate, like dctl-crypto pins its primitives).
# Kept here rather than in the workspace table so the presentation layer can
# evolve without touching every other crate's dependency surface.
clap_complete = "4"
indicatif = "0.17"
anstream = "0.6"
anstyle = "1"
toml = "0.8"
unicode-normalization = "0.1"

# `dctl mount`, on the two platforms that have a FUSE layer. Target-gated rather
# than optional, because a Cargo feature would let a Windows build be configured
# into a state where `crate::mount` is compiled without a kernel interface behind
# it; the target gate makes "this platform has no mount" a fact of the build, and
# `commands::mount` answers it with a refusal naming WinFSP (`PLAN.md` §15).
#
# Linux takes fuser's pure-Rust mount path: no C library at build time, only
# `fusermount3` at run time. See the workspace table for the reasoning.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { workspace = true }

# macOS takes the same crate with its mount implementation switched *off*.
#
# `macos-no-mount` compiles fuser's protocol and session layers with no mount at
# all, so nothing links libfuse and `fuser::Session::from_fd` takes a descriptor
# the caller mounted. That is what `crate::mount::macfuse` supplies, and it is the
# only configuration that reaches macFUSE 5: fuser's default macOS path
# pkg-config-probes for macFUSE 4 and calls `fuse_mount_compat25`, which fails
# against 5.x. Verify the selection from the build rather than from this file —
# `target/debug/build/fuser-*/output` must contain
# `fuser_mount_impl="macos-no-mount"` and no `rustc-link-lib=fuse`.
#
# `macfuse-4-compat` comes with it because it is the ABI the installed macFUSE
# speaks: it adds the `flags` and `padding` fields macFUSE 4 and later carry in
# `fuse_rename_in`. fuser's own build script sets this cfg on every other macOS
# path, so leaving it off would make `macos-no-mount` the one configuration that
# parses a rename request with the wrong layout. The mount refuses every rename
# with `EROFS`, but it has to *parse* one first in order to refuse it.
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { workspace = true, features = ["macos-no-mount", "macfuse-4-compat"] }
# Two syscall crates for three calls, and the split is `#![forbid(unsafe_code)]`
# deciding it rather than taste.
#
# `rustix` carries the descriptor handover — `socketpair` and `recvmsg` with an
# `SCM_RIGHTS` control message — because its ancillary API hands a received
# descriptor back as an **`OwnedFd`**. `nix` hands the same thing back as a bare
# integer, and turning that into something owned needs `OwnedFd::from_raw_fd`,
# which is `unsafe`. Saving a dependency is not worth an `unsafe` block around
# the one descriptor whose ownership decides whether a macFUSE mount instance
# outlives its server.
#
# `nix` carries `unmount(2)`, because `rustix`'s mount module is Linux-only and
# BSD `unmount` is not in it. Both crates are already in the graph — `rustix`
# through `tempfile`, `nix` as `fuser`'s own, at the same version — so neither is
# a new compilation unit.
rustix = { workspace = true }
nix = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
