[package]
name = "dctl-store"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DCTL storage layer — provider-neutral Backend abstraction with verified writes and Range reads"

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-post-quantum = { workspace = true }
webpki-roots = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hmac = { workspace = true }
quick-xml = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
openssh = { version = "0.11", features = ["native-mux"] }
openssh-sftp-client = { version = "0.15", features = ["openssh"] }
# Drives the SFTP `ReadDir` stream (a `futures_core::Stream`) with a clean
# `.next().await` in the recursive listing walk.
tokio-stream = "0.1"

[dev-dependencies]
bytes = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
# Test-only. `tests/write_failure.rs` imposes RLIMIT_FSIZE to provoke the
# deferred write failure that used to surface as a checksum mismatch; the
# library itself is `#![forbid(unsafe_code)]` and links no libc.
libc = { workspace = true }
